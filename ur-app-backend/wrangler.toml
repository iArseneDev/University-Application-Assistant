name = "university-application-assistant"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ur-app-db"
database_id = "acd3e4e7-74f5-4dff-a9f4-af57a8dfd21d" 

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
ADMIN_EMAIL="admin@applicationgate.com"
# Set JWT_SECRET, ADMIN_EMAIL, and ADMIN_PASSWORD with `wrangler secret put`.
# Never put credentials or signing keys in this file.

